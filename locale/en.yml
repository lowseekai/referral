linkrobins-referral:
  forum:
    profile:
      tab: Referrals
      invite_code_title: Your Invite Code
      invite_code_help: Share your code or referral link. Anyone who visits your link will have the code pre-filled automatically when they sign up.
      copy: Copy
      copy_link: Copy Referral Link
      qr_button: QR Code
      channel_legacy: Personal
      channel_group: User group
      channel_purchase: Points purchase
      channel_campaign: Campaign
      used: Used
      expired: Expired
      uses: "{count} use"
      expires_at: "Expires: {date}"
      no_expiry: Never expires
      group_quota: "{current} / {max} active group codes"
      generate: Generate invite code
      purchase_summary: "Buy an invite code for {price} {currency}"
      daily_remaining: "{remaining} purchases remaining today"
      purchase: Buy with points
      my_codes: My invite codes
      no_codes: No invite codes yet.
      total_referrals: Total Referrals
      no_referrals: No referrals yet. Share your invite code to get started!
      not_eligible: You're not eligible for a personal invite code yet. Keep participating and check back later.
    sign_up:
      invite_code_label: Invite Code
      invite_code_label_required: "Invite Code *"
      # Names the field rather than showing an example code, because anyone who
      # hides the labels with custom CSS has only this to go on. Translate it
      # like any other string to change it. Asked for on discuss d/39203 #50.
      invite_code_placeholder: Invite Code
    user_card:
      referrals_singular: "{count} referral"
      referrals_plural: "{count} referrals"
    notifications:
      registered_text: "{name} joined using your invite code"
      someone: Someone
      group_label: Referrals
    settings:
      notify_registered_label: Someone joins using your invite code
  admin:
    settings:
      title: General
      require_label: Require invite code to register
      require_help: When enabled, users must enter a valid invite code to complete registration.
      enabled: Enabled
      disabled: Disabled
    eligibility:
      title: Personal invite code eligibility
      help: Control who gets their own personal invite code. Admins and whitelisted users always qualify. Leave a rule empty or at 0 to skip it; when several rules are set, a user must satisfy all of them.
      groups_label: Allowed groups
      groups_help: If any groups are selected, only members of those groups get a personal invite code. Leave all unchecked to allow every group.
      min_posts_label: Minimum posts
      min_age_label: Minimum account age (days)
      whitelist_label: Whitelist
      whitelist_help: Usernames that always get an invite code, regardless of the rules above. Separate with commas, spaces, or new lines.
    campaign:
      title: Campaign codes
      help: Standalone invite codes that aren't tied to any user — ideal for social media or marketing promotions. They don't credit a referrer, but their uses are counted.
      label_label: Label
      label_placeholder: e.g. Twitter launch
      expiry_label: Expires (optional)
      create: Create code
      none: No campaign codes yet.
      col_code: Code
      col_label: Label
      col_uses: Uses
      col_expiry: Expires
      no_expiry: Never
      expired: expired
      delete: Delete
      qr: Show QR code
      confirm_delete: Delete this campaign code? Anyone using it will no longer be able to register with it.
    purchase:
      title: Points purchase
      help: Allow eligible members to buy single-use invite codes with their point balance.
      enabled_label: Enable points purchase
      price_label: Price per invite code
      daily_limit_label: Daily purchase limit
      daily_limit_help: Use 0 for no daily limit. The limit resets at midnight Beijing time.
      expiry_label: Invite-code validity (hours)
      expiry_help: Use 0 for codes that never expire. Times are calculated in Beijing time.
      reward_label: Inviter reward
      reward_help: Points awarded only to the inviter after a successful registration.
    group_rules:
      title: User group invite-code quotas
      help: Users in multiple configured groups use the group with the highest quantity. Expired or used codes free quota, but users must generate replacements manually.
      group_label: User group
      quantity_label: Maximum active codes
      expiry_label: Validity (hours)
      expiry_help: Use 0 for no expiry.
  # Shared between the forum and admin frontends (core only delivers the
  # forum/admin/lib namespaces to the browser).
  lib:
    qr:
      title: "Invite QR code: {code}"
      download: Download PNG
  api:
    invalid_expiry: Invalid expiry date.
    label_too_long: The label is too long.
    group_quota_reached: You have no remaining group invite-code quota.
    purchase_disabled: Point purchases are currently disabled.
    point_system_unavailable: The point system is not available.
    purchase_not_configured: Invite-code purchasing is not configured.
    daily_limit_reached: You have reached today's invite-code purchase limit.
    insufficient_points: You do not have enough points to buy an invite code.
  # Server-side only (email notifications); never delivered to the browser.
  email:
    registered_subject: "{name} joined using your invite code"
    registered_body: "Good news! {name} just registered on the forum using your invite code."
    view_profile: View their profile
    someone: Someone
  validation:
    required: An invite code is required to register.
    invalid: Invalid invite code.
